# Update Checker Settings
update-checker:
  enable: true
  console: true # Post message to console
  op: true # Send update notification to opped players on join

# Language, specify the language file to use, for example `en_US` which will load `/lang/en_US.json`
language: "en_US"

ItemSettings:
  # Options include: VANILLA, ITEMSADDER, ORAXEN, NEXO and MMOITEMS
  # An item provider plugin is recommended such as Nexo !!
  item-provider: "VANILLA"

  # The following onlyss applies if the "item-provider" is NOT "VANILLA", using an item plugin
  control-item-id: "siegeengines_control_item"
  fire-item-id: "siegeengines_fire_item"

  default-control-item:
    material: CLOCK
    model-id: "siegeengines:item/control_item"
    display-name: "<yellow>Calibrator"

  default-fire-item:
    material: FLINT
    model-id: "siegeengines:item/fire_item"
    display-name: "<yellow>Match"

SiegeEngineSettings:
  trebuchet:
    health: 8
    velocity-per-propellant: 0.75
    max-propellant: 3
    propellant-type: STRING
    allowed-shots:
      - StoneShot
      - IncendiaryShot
      - SplashPotionShot
      - LingeringPotionShot

  ballista:
    health: 5
    velocity-per-propellant: 0.5
    max-propellant: 2
    propellant-type: STRING
    allowed-shots:
      - BallistaBoltShot
      - ArrowScatterShot
      - FireworkShot
      - SplashPotionShot
      - LingeringPotionShot
      - DragonsBreathShot

  swivel-cannon:
    health: 8
    velocity-per-propellant: 0.75
    max-propellant: 3
    propellant-type: STRING
    allowed-shots:
      - StoneShot
      - IncendiaryShot
      - CannonballShot
      - GrapeShot
      - ExplosiveShot

  breach-cannon:
    health: 8
    velocity-per-propellant: 0.75
    max-propellant: 3
    propellant-type: STRING
    allowed-shots:
      - StoneShot
      - IncendiaryShot
      - CannonballShot
      - GrapeShot
      - ExplosiveShot
      - BreachShot

#projectile fields:

Shots:
  StoneShot:
    ProjectileType: EXPLOSIVE
    ExplodePower: 2.5
    Inaccuracy: 0.125
    ProjectileCount: 1
    VelocityFactor: 1.0
    AmmoItem: COBBLESTONE
    FireSound: ENTITY_GENERIC_EXPLODE
  CannonShot:
      ProjectileType: EXPLOSIVE
      ExplodePower: 3.0
      Inaccuracy: 0.125
      ProjectileCount: 1
      VelocityFactor: 1.0
      AmmoItem: IRON_INGOT
      FireSound: ENTITY_GENERIC_EXPLODE
  BreachShot:
      ProjectileType: EXPLOSIVE
      ExplodePower: 4.0
      Inaccuracy: 0.185
      ProjectileCount: 1
      VelocityFactor: 1.25
      AmmoItem: IRON_BLOCK
      FireSound: ENTITY_GENERIC_EXPLODE
  RepeatingShot:
      ProjectileType: EXPLOSIVE
      ExplodePower: 2.0
      Inaccuracy: 0.275
      ProjectileCount: 3
      VelocityFactor: 1.3
      AmmoItem: TNT
      FireSound: ENTITY_GENERIC_EXPLODE
  BallistaScatterShot:
      ProjectileType: ENTITY
      Inaccuracy: 0.125
      ProjectileCount: 30
      VelocityFactor: 3.0
      EntityType: ARROW
      ArrowDamageFactor: 0.75
      AmmoItem: GRAVEL
      FireSound: ITEM_CROSSBOW_SHOOT
  GrapeShot:
      ProjectileType: ENTITY
      Inaccuracy: 0.125
      ProjectileCount: 30
      VelocityFactor: 1.0
      EntityType: ARROW
      ArrowDamageFactor: 0.75
      AmmoItem: GRAVEL
      FireSound: ENTITY_GENERIC_EXPLODE
  BallistaBoltShot:
      ProjectileType: ENTITY
      Inaccuracy: 0.0125
      ProjectileCount: 1
      VelocityFactor: 5.0
      EntityType: ARROW
      ArrowDamageFactor: 0.75
      AmmoItem: ARROW
      FireSound: ITEM_CROSSBOW_SHOOT
  DragonsBreath:
      ProjectileType: ENTITY
      Inaccuracy: 0.65
      ProjectileCount: 3
      VelocityFactor: 1.125
      EntityType: DRAGON_FIREBALL
      AmmoItem: DRAGON_BREATH
      FireSound: ENTITY_GENERIC_EXPLODE
  FireShot:
      ProjectileType: ENTITY
      Inaccuracy: 0.225
      ProjectileCount: 32
      VelocityFactor: 1.0
      EntityType: SMALL_FIREBALL
      AmmoItem: MAGMA_BLOCK
      FireSound: ENTITY_GENERIC_EXPLODE
  FireworkShot:
      ProjectileType: FIREWORK
      Inaccuracy: 0.125
      ProjectileCount: 1
      VelocityFactor: 0.001
      Delay: 5
  SplashPotionProjectile:
      ProjectileType: POTION
      Inaccuracy: 0.0125
      ProjectileCount: 2
      VelocityFactor: 8.0
      AmmoItem: SPLASH_POTION
      FireSound: ITEM_CROSSBOW_SHOOT